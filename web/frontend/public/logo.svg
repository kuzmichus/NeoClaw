<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240">
    <defs>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#071120"/>
            <stop offset="1" stop-color="#03080f"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0d2138"/>
            <stop offset="1" stop-color="#071527"/>
        </linearGradient>
        <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#37f6ff"/>
            <stop offset="1" stop-color="#00a2ff"/>
        </linearGradient>
        <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#00f0ff" stop-opacity="0.18">
                <animate attributeName="stop-opacity" values="0.18;0.34;0.18" dur="4s" repeatCount="indefinite"/>
            </stop>
            <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0H0V24" fill="none" stroke="#0e2a44" stroke-width="1"/>
        </pattern>
        <linearGradient id="neoShimmer" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#00f0ff">
                <animate attributeName="stop-color" values="#00f0ff;#7df9ff;#00f0ff" dur="3s" repeatCount="indefinite"/>
            </stop>
            <stop offset="0.45" stop-color="#00a2ff">
                <animate attributeName="stop-color" values="#00a2ff;#00f0ff;#00a2ff" dur="3s" repeatCount="indefinite"/>
            </stop>
            <stop offset="1" stop-color="#00f0ff">
                <animate attributeName="stop-color" values="#00f0ff;#7df9ff;#00f0ff" dur="3s" repeatCount="indefinite"/>
            </stop>
            <animateTransform attributeName="gradientTransform" type="translate"
                              values="-1 0; 1 0; -1 0" dur="4s" repeatCount="indefinite"/>
        </linearGradient>
    </defs>

    <rect width="780" height="240" rx="24" fill="url(#bg)"/>
    <rect width="780" height="240" rx="24" fill="url(#grid)" opacity="0.5"/>
    <ellipse cx="124" cy="115" rx="130" ry="115" fill="url(#aura)"/>

    <g transform="translate(34,32)">
        <g stroke="#00f0ff" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow)">
            <path d="M70 45 L58 18">
                <animate attributeName="d" values="M70 45 L58 18; M70 45 L54 20; M70 45 L58 18" dur="3.2s" repeatCount="indefinite"/>
            </path>
            <path d="M110 45 L122 18">
                <animate attributeName="d" values="M110 45 L122 18; M110 45 L126 20; M110 45 L122 18" dur="3.2s" repeatCount="indefinite"/>
            </path>
        </g>
        <circle cx="58" cy="16" r="5" fill="#00f0ff" filter="url(#glow)">
            <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="122" cy="16" r="5" fill="#ff2d95" filter="url(#glow)">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
        </circle>

        <g stroke="#00c8e0" stroke-width="5" fill="none" stroke-linecap="round">
            <path d="M40 118 L15 140"><animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/></path>
            <path d="M48 124 L28 152"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/></path>
            <path d="M58 128 L42 160"><animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/></path>
            <path d="M70 130 L58 166"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/></path>
            <path d="M140 118 L165 140"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/></path>
            <path d="M132 124 L152 152"><animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/></path>
            <path d="M122 128 L138 160"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/></path>
            <path d="M110 130 L122 166"><animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/></path>
        </g>
        <g fill="#00f0ff" filter="url(#glow)">
            <circle cx="15" cy="140" r="4"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="28" cy="152" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="42" cy="160" r="4"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="58" cy="166" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="165" cy="140" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="152" cy="152" r="4"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="138" cy="160" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="122" cy="166" r="4"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
        </g>

        <g fill="#0d2138" stroke="#00f0ff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)">
            <g>
                <animateTransform attributeName="transform" type="rotate" values="-3 30 88; 3 30 88; -3 30 88" dur="4s" repeatCount="indefinite"/>
                <path d="M30 82 L8 66 L0 48 L16 68 L4 78 L24 94 L30 94 Z"/>
            </g>
            <g>
                <animateTransform attributeName="transform" type="rotate" values="3 150 88; -3 150 88; 3 150 88" dur="4s" repeatCount="indefinite"/>
                <path d="M150 82 L172 66 L180 48 L164 68 L176 78 L156 94 L150 94 Z"/>
            </g>
        </g>

        <path d="M30 75 L55 45 L125 45 L150 75 L150 100 L125 125 L55 125 L30 100 Z"
              fill="url(#body)" stroke="#00f0ff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)">
            <animate attributeName="stroke-opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
        </path>
        <path d="M42 80 L62 56 L118 56 L138 80 L138 96 L118 118 L62 118 L42 96 Z"
              fill="none" stroke="#0a3a55" stroke-width="2"/>

        <circle cx="75" cy="70" r="9" fill="#03121f" stroke="#00f0ff" stroke-width="3"/>
        <circle cx="75" cy="70" r="4" fill="#00f0ff" filter="url(#glow)">
            <animate attributeName="opacity" values="1;1;0.2;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="105" cy="70" r="9" fill="#03121f" stroke="#ff2d95" stroke-width="3"/>
        <circle cx="105" cy="70" r="4" fill="#ff2d95" filter="url(#glow)">
            <animate attributeName="opacity" values="1;1;0.2;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
        </circle>

        <g filter="url(#glow)">
            <rect x="75" y="80" width="30" height="30" rx="4" fill="url(#chip)">
                <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
            </rect>
            <rect x="82" y="87" width="16" height="16" rx="2" fill="#03121f"/>
            <rect x="85" y="90" width="10" height="10" rx="1" fill="#00f0ff">
                <animate attributeName="fill" values="#00f0ff;#7df9ff;#00f0ff" dur="2s" repeatCount="indefinite"/>
            </rect>
        </g>
        <g stroke="#00f0ff" stroke-width="3" stroke-linecap="round">
            <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
            <line x1="75" y1="86" x2="68" y2="86"/>
            <line x1="75" y1="95" x2="68" y2="95"/>
            <line x1="75" y1="104" x2="68" y2="104"/>
            <line x1="105" y1="86" x2="112" y2="86"/>
            <line x1="105" y1="95" x2="112" y2="95"/>
            <line x1="105" y1="104" x2="112" y2="104"/>
            <line x1="81" y1="80" x2="81" y2="73"/>
            <line x1="90" y1="80" x2="90" y2="73"/>
            <line x1="99" y1="80" x2="99" y2="73"/>
            <line x1="81" y1="110" x2="81" y2="117"/>
            <line x1="90" y1="110" x2="90" y2="117"/>
            <line x1="99" y1="110" x2="99" y2="117"/>
        </g>
    </g>

    <g font-family="Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" letter-spacing="3">
        <text x="252" y="146" font-size="82" fill="url(#neoShimmer)" filter="url(#glowBig)">NEO
            <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
        </text>
        <text x="452" y="146" font-size="82" fill="#E8543F" filter="url(#glow)">CLAW</text>
    </g>
</svg>